# Generated by tungo-sdkgen. Do not edit.
AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - ".bundle/**/*"
    - "pkg/**/*"
    - "tmp/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

# "tungo-sdk.rb" exists so that Bundler can auto-require the gem by its name.
Naming/FileName:
  Exclude:
    - "lib/tungo-sdk.rb"

# The resources and models mirror the API contract: one keyword argument per property and one
# method per operation, so their size is dictated by the contract, not by design.
Metrics/ParameterLists:
  CountKeywordArgs: false

Naming/MethodParameterName:
  Exclude:
    - "lib/tungo/resources/*.rb"

Metrics/MethodLength:
  Max: 30
  Exclude:
    - "lib/tungo/resources/*.rb"
    - "test/**/*"

Metrics/ClassLength:
  Max: 300
  Exclude:
    - "lib/tungo/resources/*.rb"
    - "test/**/*"

Metrics/ModuleLength:
  Max: 200

Metrics/AbcSize:
  Max: 40
  Exclude:
    - "test/**/*"

Metrics/CyclomaticComplexity:
  Max: 15

Metrics/PerceivedComplexity:
  Max: 15

Metrics/BlockLength:
  Exclude:
    - "*.gemspec"
    - "test/**/*"

# Property and parameter names come from the contract.
Naming/PredicatePrefix:
  Exclude:
    - "lib/tungo/models/*.rb"

# The examples are scripts that print their results.
Style/TopLevelMethodDefinition:
  Enabled: false
